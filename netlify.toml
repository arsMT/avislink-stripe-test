[build]
command = "mkdir -p public functions && cp *.html *.js *.svg *.txt public/ && cp stripe-test-*.cjs functions/"
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"
