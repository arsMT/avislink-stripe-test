<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon commerce • AvisLink</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2fb;color:#26243c;font:16px Arial,sans-serif}.box{width:min(420px,90vw);background:#fff;box-sizing:border-box;padding:32px;border-radius:24px;box-shadow:0 18px 70px #17112a16;text-align:center}#logo{width:110px;height:110px;object-fit:contain;border-radius:24px;margin:0 auto;background:#f3eeff}h1{font-size:29px}p{line-height:1.6;color:#777489}.button{display:block;margin:13px 0;padding:15px;background:#6958d8;border-radius:12px;color:#fff;text-decoration:none;font-weight:bold}.secondary{background:#f3f0fc;color:#352d62}#details{padding-top:12px;font-size:14px}footer{margin-top:35px;color:#aaa7b7;font-size:12px}</style></head><body><main class="box" id="content"><p>Chargement de votre fiche…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script>
(async()=>{const box=document.getElementById('content'),slug=new URLSearchParams(location.search).get('slug');const c=window.AVISLINK_CONFIG;if(!slug||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){box.textContent='Fiche indisponible.';return}const sup=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {data:d,error}=await sup.from('merchants').select('name,description,logo_url,google_url,phone,instagram,website,address,hours').eq('slug',slug).maybeSingle();if(error||!d){box.textContent='Cette fiche est introuvable.';return}const h=t=>String(t||'').replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[v]));const link=(s,label,extra='')=>{try{const url=new URL(s);return url.protocol==='https:'?`<a class="button ${extra}" href="${h(url.href)}" rel="noopener noreferrer" target="_blank">${label}</a>`:''}catch{return ''}};box.innerHTML=`${d.logo_url&&/^https:\/\//.test(d.logo_url)?`<img id="logo" src="${h(d.logo_url)}" alt="Logo du commerce">`:''}<h1>${h(d.name)}</h1><p>${h(d.description)}</p>${link(d.google_url,'★ Donner un avis sur Google')}${d.address?link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.address),'⌖ Itinéraire','secondary'):''}${d.phone?`<a class="button secondary" href="tel:${h(d.phone.replace(/[^+0-9]/g,''))}">☎ Appeler</a>`:''}${link(d.website,'🌐 Site web','secondary')}${link(d.instagram,'◎ Instagram','secondary')}<p id="details">${h(d.hours)}<br>${h(d.address)}</p><footer>Connecté avec AvisLink.</footer>`})();
</script></body></html>
